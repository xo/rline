# The checks PLAN.md lists, run on every system that has a hosted runner.
#
# The matrix is the three supported systems plus Linux on arm64. macOS
# runners are arm64 and Windows runners are amd64, so between them the four
# jobs cover both architectures on two of the three systems.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-26.04-arm
          - name: windows-amd64
            runner: windows-latest
          - name: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The version the module asks for, rather than the newest. A library
      # that only builds with the newest Go is one its consumers cannot use,
      # and this one dropped to 1.25.0 so that FreeBSD could build it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go version
        run: go version

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Every system, not only the one this job runs on. A test file whose
      # build tag no longer matches its source still compiles where both are
      # excluded, and only vet on a system where they disagree says so. That
      # happened once and went unnoticed for an hour.
      #
      # GOARCH is pinned to amd64 rather than left at the runner's. This
      # loop is about build tags, which do not vary by architecture, and
      # several of these systems have no arm64 port at all: the first arm64
      # run failed on "unsupported GOOS/GOARCH pair dragonfly/arm64". The
      # architecture of the runner is covered by the plain vet step above.
      - name: vet every system
        shell: bash
        run: |
          # Enumerated from the toolchain, not typed. This loop was ten GOOS
          # values written by hand, and a loop cannot report on what it was
          # not given: its output looked the same as a complete one. It was
          # silently missing aix, android, ios, js and wasip1 — and aix is a
          # platform this package's own build tags name, `unix && !aix`.
          #
          # go tool dist list also gives real pairs, which is why GOARCH is
          # no longer pinned to amd64. That pin existed because an arm64
          # sweep hit "unsupported GOOS/GOARCH pair dragonfly/arm64"; an
          # enumeration never proposes a pair that does not exist.
          #
          # A target that cannot be asked is reported rather than skipped,
          # and "cannot" is separated from "not as invoked". android and ios
          # need external linking, so CGO_ENABLED=0 — the default for a
          # cross-target — stops vet before it reads any source. That is an
          # environment variable, not a missing toolchain, so the loop
          # retries with cgo on before giving up.
          #
          # Which pairs survive that retry depends on the runner, and the
          # matrix is what makes it worth doing: with cgo on, linux answers
          # android/386, android/amd64 and ios/amd64, while a macOS runner
          # answers ios/arm64 because its own clang can target it. Neither
          # answers android/arm. So these pairs are not unaskable in
          # themselves — being askable is a property of the pair and the
          # machine together, and the union across the matrix covers more
          # than any single job.
          #
          # Swallowing the rest would be the same failure as the hand-written
          # list: a loop that quietly drops what it cannot build reports
          # clean for the wrong reason.
          unaskable=0
          withcgo=0
          for pair in $(go tool dist list); do
            if GOOS=${pair%/*} GOARCH=${pair#*/} go vet ./... 2>/tmp/vet.err; then
              continue
            fi
            if grep -q 'requires external (cgo) linking' /tmp/vet.err; then
              if CGO_ENABLED=1 GOOS=${pair%/*} GOARCH=${pair#*/} go vet ./... 2>/tmp/vet.err; then
                echo "-- $pair: vetted with CGO_ENABLED=1"
                withcgo=$((withcgo + 1))
                continue
              fi
              echo "-- $pair: not askable on this runner, no cgo cross toolchain"
              unaskable=$((unaskable + 1))
              continue
            fi
            echo "== $pair =="
            cat /tmp/vet.err
            exit 1
          done
          echo "vetted $(go tool dist list | wc -l) pairs: $withcgo needed cgo, $unaskable not askable here"

      # One test is skipped on Windows rather than the package it lives in.
      # TestGoldenSetIsPresent fails there by design, because recording a
      # session needs a pseudo console that nobody has written, and a job
      # that is always red teaches people to ignore it.
      #
      # Dropping the whole package was the first attempt and was wrong.
      # windows-vm pointed out that it would take TestRecordIsUnsupported
      # with it, which is tagged !linux && !darwin and exists to check this
      # very platform, so the only automated Windows environment anyone has
      # would stop running the one test written for it. That is the
      # tagged-out shape from PLAN.md, chosen on purpose. Skipping the one
      # test costs nothing and they measured it green.
      - name: test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test -count=1 -skip TestGoldenSetIsPresent ./...
          else
            go test -count=1 ./...
          fi

      # The one step in this project that needs a C toolchain on Windows.
      # The race detector requires cgo there, and the hosted runner ships
      # mingw-w64. A Windows contributor running these steps by hand without
      # a compiler will be told "-race requires cgo" and reasonably think
      # they have broken something. They have not: everything else here is
      # arranged so that no compiler is needed.
      - name: test under the race detector
        run: go test -race -count=1 . ./key

      - name: lint
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -File tools/lint.ps1
          else
            ./tools/lint.sh
          fi
