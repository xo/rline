version: "2"
linters:
  # errcheck, govet, ineffassign, staticcheck and unused are on by default in
  # golangci-lint v2; gosimple was folded into staticcheck.
  enable:
    - errorlint
    - gocritic
    - nilerr
    - prealloc
    - revive
    - unconvert
    - usetesting
    - wrapcheck
  settings:
    errcheck:
      # A deferred close on a file opened for reading is the one unchecked
      # error worth having: the read already succeeded or already failed, and
      # the close can say nothing that changes either. Writing it as
      # `defer func() { _ = f.Close() }()` is three tokens of ceremony that
      # say only what this line says once.
      #
      # This is (*os.File).Close and nothing wider. It is not scoped to defer,
      # because errcheck cannot express that, so a future unchecked close on a
      # file opened for WRITING would also pass. That is the cost, and it is
      # why history.go checks its write close explicitly and says why.
      exclude-functions:
        - (*os.File).Close
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      # Only checks that gocritic does not already enable by default.
      enabled-checks:
        - nilValReturn
        - unnecessaryBlock
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-naming
